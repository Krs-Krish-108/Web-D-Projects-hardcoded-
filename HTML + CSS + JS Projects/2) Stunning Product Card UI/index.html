<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Product Card</title>
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="product-card">
        <div class="product-image">
            <span class="discount">-25%</span>
            <button class="wishlist">
                <i class='bx bx-heart'></i>
            </button>
            <span class="nike">Nike</span>
            <img src="pngwing.com.png" alt="Nike Air Max">
            <button class="quick-view">Quick View</button>
        </div>
        <div class="product-content">
            <div class="category">Footwear</div>
            <h2 class="product-tile">Nike Air Max</h2>
            <p class="product-description">Experience unparalleled comfort and style with the Nike Air Max. Perfect for everyday wear or intense workouts.</p>
            <div class="rating-row">
                <div class="stars">
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                </div>
                <span class="review-counter">4.8 (126 reviews)</span>
            </div>
            <div class="price-row">
                <span class="current-price">₹129.99</span>
                <span class="original-price">₹179.99</span>
            </div>
            <div class="card-footer">
                <div class="quantity">
                    <div class="minus">-</div> <span class="quantity-value">1</span> <div class="plus">+</div>
                </div>
                <button class="add-to-cart"> <i class="bx bxs-cart-alt"></i> Add to cart </button>
            </div>
        </div>
    </div>
</body>
</html>
